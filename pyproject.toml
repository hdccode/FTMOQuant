[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ftmoquant"
version = "0.1.0"
description = "Quantitative trading research tooling for FTMO."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ftmoquant"]
