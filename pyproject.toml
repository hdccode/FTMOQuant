[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ftmoquant"
version = "0.1.0"
description = "Quantitative trading research tooling for FTMO."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arch==8.0.0",
    "huggingface-hub==1.27.0",
    "nautilus-trader==2.0.0rc2",
    "pandas>=2.3.3,<4.0.0",
    "pyarrow>=16.1,<23.0.0",
    "pyyaml>=6.0.3",
    "tradedesk-dukascopy==1.0.0",
]

[project.scripts]
ftmoquant-ingest-eurusd = "ftmoquant.data.dukascopy:main"
ftmoquant-ingest-hf-eurusd = "ftmoquant.data.hf_dukascopy:main"
ftmoquant-derive-eurusd-bars = "ftmoquant.data.derived_bars:main"
ftmoquant-qa-eurusd-coverage = "ftmoquant.data.session_coverage:main"
ftmoquant-reconcile-eurusd-gaps = "ftmoquant.data.session_reconciliation:main"
ftmoquant-correct-eurusd = "ftmoquant.data.canonical_correction:main"
ftmoquant-ingest-hf-instrument = "ftmoquant.data.g1_4_cli:ingest_main"
ftmoquant-derive-instrument-bars = "ftmoquant.data.g1_4_cli:derive_main"
ftmoquant-qa-instrument-coverage = "ftmoquant.data.g1_4_cli:coverage_main"
ftmoquant-reconcile-instrument-gaps = "ftmoquant.data.g1_4_cli:reconcile_main"
ftmoquant-correct-instrument = "ftmoquant.data.g1_4_cli:correct_main"
ftmoquant-materialize-instrument-splits = "ftmoquant.data.g1_4_cli:split_main"
ftmoquant-freeze-instrument-readiness = "ftmoquant.data.g1_4_cli:freeze_instrument_main"
ftmoquant-freeze-universe-readiness = "ftmoquant.data.g1_4_cli:freeze_universe_main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ftmoquant"]
