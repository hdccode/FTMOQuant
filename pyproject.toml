[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ftmoquant"
version = "0.1.0"
description = "Quantitative trading research tooling for FTMO."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arch==8.0.0",
    "huggingface-hub==1.27.0",
    "nautilus-trader==2.0.0rc2",
    "optuna>=4.5,<5",
    "pandas>=2.3.3,<4.0.0",
    "pyarrow>=16.1,<23.0.0",
    "pyyaml>=6.0.3",
    "tradedesk-dukascopy==1.0.0",
    "vectorbt==1.1.0",
]

[project.scripts]
ftmoquant-ingest-eurusd = "ftmoquant.data.dukascopy:main"
ftmoquant-ingest-hf-eurusd = "ftmoquant.data.hf_dukascopy:main"
ftmoquant-derive-eurusd-bars = "ftmoquant.data.derived_bars:main"
ftmoquant-qa-eurusd-coverage = "ftmoquant.data.session_coverage:main"
ftmoquant-reconcile-eurusd-gaps = "ftmoquant.data.session_reconciliation:main"
ftmoquant-correct-eurusd = "ftmoquant.data.canonical_correction:main"
ftmoquant-ingest-hf-instrument = "ftmoquant.data.g1_4_cli:ingest_main"
ftmoquant-derive-instrument-bars = "ftmoquant.data.g1_4_cli:derive_main"
ftmoquant-qa-instrument-coverage = "ftmoquant.data.g1_4_cli:coverage_main"
ftmoquant-reconcile-instrument-gaps = "ftmoquant.data.g1_4_cli:reconcile_main"
ftmoquant-correct-instrument = "ftmoquant.data.g1_4_cli:correct_main"
ftmoquant-materialize-instrument-splits = "ftmoquant.data.g1_4_cli:split_main"
ftmoquant-freeze-instrument-readiness = "ftmoquant.data.g1_4_cli:freeze_instrument_main"
ftmoquant-freeze-universe-readiness = "ftmoquant.data.g1_4_cli:freeze_universe_main"
ftmoquant-import-macro-events = "ftmoquant.data.macro_events:main"
ftmoquant-evaluate-ts-momentum-development = "ftmoquant.research.ts_momentum_development:main"
ftmoquant-evaluate-session-range-expansion-development = "ftmoquant.research.session_range_expansion_development:main"
ftmoquant-evaluate-liquidity-shock-reversion-development = "ftmoquant.research.liquidity_shock_reversion_development:main"
ftmoquant-evaluate-leo-gbpusd-development = "ftmoquant.research.leo_gbpusd_development:main"
ftmoquant-prepare-leo-gbpusd-development-cache = "ftmoquant.research.leo_gbpusd_development:prepare_cache_main"
ftmoquant-evaluate-usd-macro-surprise-momentum-development = "ftmoquant.research.usd_macro_surprise_momentum_development:main"
ftmoquant-evaluate-carver-trend-carry-ftmo5-development = "ftmoquant.research.carver_trend_carry_ftmo5_development:main"
ftmoquant-evaluate-eurusd-tsm-development = "ftmoquant.research.eurusd_tsm_development:main"
ftmoquant-evaluate-mean-reversion-h1-development = "ftmoquant.research.mean_reversion_h1_development:main"
ftmoquant-evaluate-usdcad-sweep-bos-retest = "ftmoquant.research.usdcad_sweep_bos_retest_development:main"
ftmoquant-validate-eurusd-tsm = "ftmoquant.research.eurusd_tsm_validation:main"
ftmoquant-acquire-carver-oanda-development = "ftmoquant.data.oanda_development:main"
ftmoquant-acquire-oanda-alpha-lab-development = "ftmoquant.data.oanda_alpha_lab_development:main"
ftmoquant-canonicalize-oanda-alpha-lab-instrument = "ftmoquant.data.oanda_alpha_lab_development:canonicalize_main"
ftmoquant-derive-oanda-alpha-lab-bars = "ftmoquant.data.oanda_alpha_lab_development:derive_main"
ftmoquant-freeze-oanda-alpha-lab-readiness = "ftmoquant.data.oanda_alpha_lab_development:readiness_main"
ftmoquant-acquire-oanda-alpha-lab-validation = "ftmoquant.data.oanda_alpha_lab_validation:main"
ftmoquant-canonicalize-oanda-alpha-lab-validation-instrument = "ftmoquant.data.oanda_alpha_lab_validation:canonicalize_main"
ftmoquant-derive-oanda-alpha-lab-validation-bars = "ftmoquant.data.oanda_alpha_lab_validation:derive_main"
ftmoquant-freeze-oanda-alpha-lab-validation-readiness = "ftmoquant.data.oanda_alpha_lab_validation:readiness_main"
ftmoquant-alpha-smoke = "ftmoquant.research.alpha_lab.smoke:main"
ftmoquant-alpha-screening-batch = "ftmoquant.research.alpha_lab.screening_batch:main"
ftmoquant-alpha-screening-stage2 = "ftmoquant.research.alpha_lab.screening_stage2:main"
ftmoquant-alpha-validation-preregister = "ftmoquant.research.alpha_lab.validation:preregister_main"
ftmoquant-alpha-validation-run = "ftmoquant.research.alpha_lab.validation:main"
ftmoquant-alpha-pair-specific-validation-preregister = "ftmoquant.research.alpha_lab.pair_specific_validation:preregister_main"
ftmoquant-alpha-pair-specific-validation-run = "ftmoquant.research.alpha_lab.pair_specific_validation:main"
ftmoquant-ftmo-mc-path-diagnostics = "ftmoquant.research.ftmo_pass_probability.cli:path_diagnostics_main"
ftmoquant-ftmo-mc-sizing-screen = "ftmoquant.research.ftmo_pass_probability.cli:sizing_screen_main"
ftmoquant-ftmo-mc-sizing-screen-refinement = "ftmoquant.research.ftmo_pass_probability.cli:sizing_screen_refinement_main"
ftmoquant-ftmo-mc-precision-run = "ftmoquant.research.ftmo_pass_probability.cli:precision_run_main"
ftmoquant-ftmo-mc-validation-diagnostic = "ftmoquant.research.ftmo_pass_probability.cli:validation_diagnostic_main"
ftmoquant-ftmo-mc-alpha-diagnostic = "ftmoquant.research.ftmo_pass_probability.cli:alpha_diagnostic_main"

[dependency-groups]
dev = [
    "marimo==0.23.15",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ftmoquant"]
