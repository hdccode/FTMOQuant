schema_version: 1

family:
  family_id: eurusd_tsm_v1
  version: 1.0.0
  status: preregistered_not_run
  economic_hypothesis: >-
    EUR/USD exhibits time-series persistence over some economically meaningful
    intraday-to-multiweek horizons, such that the sign and magnitude of past
    price movement contains information about subsequent returns after
    realistic trading costs.

dataset:
  instrument_id: EUR/USD.DUKASCOPY
  universe_id: g1_4_fx_usd_liquid_v1
  universe_plan_sha256: 16c29df7bae3bde0a9e64e2cc7758f158186182a3d7a464347791400abcfff69
  universe_readiness_sha256: e6d511bb7bbea6b80c42b00c3f1b4c79ea35cd4532d5f71b69ee8f43bea3f8a0
  partition: development
  development_start_utc: "2019-03-11T00:00:00Z"
  development_end_exclusive_utc: "2023-04-11T00:00:00Z"
  source: existing_canonical_g0_5_g0_6_derived_bars
  missing_data_policy: no_fill_no_interpolation_reset_signal_history

session:
  session_id: all
  optimized: false

parameter_grid:
  timeframes:
    - timeframe: H1
      bid_bar_type: EUR/USD.DUKASCOPY-1-HOUR-BID-INTERNAL
      ask_bar_type: EUR/USD.DUKASCOPY-1-HOUR-ASK-INTERNAL
      lookback_bars: [24, 72, 120, 240, 480]
      refresh_interval_bars: [1, 4, 24]
    - timeframe: H4
      bid_bar_type: EUR/USD.DUKASCOPY-4-HOUR-BID-INTERNAL
      ask_bar_type: EUR/USD.DUKASCOPY-4-HOUR-ASK-INTERNAL
      lookback_bars: [6, 18, 30, 60, 120]
      refresh_interval_bars: [1, 3, 6]
  deadband_volatility_units: [0.0, 0.25, 0.5]
  conditional_combination_rule: >-
    combine each timeframe only with its own lookback and refresh sets
  expected_unique_trial_count: 90

signal:
  price: synchronized_completed_bid_ask_midpoint_close
  trailing_return: ln(C_t / C_t_minus_lookback_bars)
  volatility:
    estimator: numpy_sample_standard_deviation_of_causal_one_bar_log_returns
    observation_window: max(20, lookback_bars)
    degrees_of_freedom: 1
    trailing_horizon_scale: sqrt(lookback_bars)
    minimum_required_closes: max(20, lookback_bars) + 1
    unavailable_policy: no_signal
    zero_or_nonfinite_policy: no_signal
    floor_or_tiny_value_manufacture: false
    backfill: false
  normalized_trailing_return: >-
    trailing_return / (one_bar_log_return_sample_std * sqrt(lookback_bars))
  targets:
    long_when: normalized_trailing_return > deadband
    short_when: normalized_trailing_return < -deadband
    flat_otherwise: true
    raw_magnitudes: [-1, 0, 1]
    signal_strength_parameter: false
  refresh:
    anchor: first_bar_with_available_causal_signal
    rule: evaluate_first_available_then_every_refresh_interval_bars
    emit_only_when_target_changes: true
    hold_latest_target_between_refreshes: true
  exits:
    stop_loss: none
    take_profit: none
    reverse_or_flatten: subsequent_causal_changed_target_only

risk_normalization:
  type: causal_pre_execution_underlying_vol_target
  target_annualized_volatility: 0.01
  implementation: ftmoquant.research.g1.normalization.G1VolatilityNormalizer
  underlying_instrument: EUR/USD.DUKASCOPY
  source: completed_bid_ask_midpoint_daily_log_returns
  daily_observation_semantics: existing_17_00_America_New_York_completed_pair
  estimator:
    library_primitive: pandas.Series.ewm.var
    kind: exponentially_weighted_variance
    center_of_mass_trading_days: 60.0
    adjust: true
    bias: false
    ignore_na: false
    minimum_completed_returns: 20
    annualization_days: 252
  observation_rule: daily_return_endpoint_information_time_strictly_before_decision
  warmup_behavior: unavailable_zero_nonzero_exposure
  future_backfill: forbidden
  pathological_volatility_behavior: fail_closed_zero_nonzero_exposure
  exposure_formula: directional_signal_times_0.01_divided_by_ex_ante_annualized_volatility
  sizing_refresh_rule: every_configured_refresh_including_unchanged_direction
  base_units_per_unit_exposure: "100000"
  target_quantity_rule: desired_exposure_times_base_units_before_native_execution
  ftmo_or_g4_sizing: false

execution_and_costs:
  engine: existing_nautilus_g0_7_bid_ask_boundary
  execution_timing: >-
    first synchronized tradable EUR/USD one-minute BID/ASK observation strictly
    after completed signal information time
  spread: observed_paired_bid_ask
  commission_slippage_latency_profile: canonical_g0_7_uncalibrated_baseline
  execution_profile_sha256: 5bfb0349fff97a08a8b5d97a6e79b39c694a9038730e1be1e5dcb3f66b3f29cc
  execution_config_sha256: 6764e2bc41cc92cecd050419bb003da82db2960c3f9feb909b75e0be139a2ba2
  base_cost_result: existing_frozen_realistic_g1_cost_model
  cost_stress_multiplier: 1.5
  cost_stress_formula: net_return_minus_one_half_realized_base_cost
  position_sizing_timing: before_native_order_submission
  native_cost_quantity_basis: actual_executed_scaled_delta_base_units
  turnover_basis: actual_executed_scaled_target_changes
  adverse_execution_perturbation: unused_no_generic_implementation

development_folds:
  version: g1.4b-development-folds-1
  semantic_sha256: 805687e8657c1482d5f8cff4b513385eebfc6a62795735fd4b390019b2e1fdfe
  folds:
    - fold_id: dev_fold_1
      train_start_utc: "2019-03-11T00:00:00Z"
      train_end_exclusive_utc: "2020-04-11T00:00:00Z"
      evaluate_start_utc: "2020-04-11T00:00:00Z"
      evaluate_end_exclusive_utc: "2021-04-11T00:00:00Z"
    - fold_id: dev_fold_2
      train_start_utc: "2019-03-11T00:00:00Z"
      train_end_exclusive_utc: "2021-04-11T00:00:00Z"
      evaluate_start_utc: "2021-04-11T00:00:00Z"
      evaluate_end_exclusive_utc: "2022-04-11T00:00:00Z"
    - fold_id: dev_fold_3
      train_start_utc: "2019-03-11T00:00:00Z"
      train_end_exclusive_utc: "2022-04-11T00:00:00Z"
      evaluate_start_utc: "2022-04-11T00:00:00Z"
      evaluate_end_exclusive_utc: "2023-04-11T00:00:00Z"

eligibility:
  required_fold_count: 3
  minimum_positive_folds: 2
  minimum_pooled_executed_transitions: 100
  sample_threshold_basis: existing_trend_pullback_development_minimum
  gates:
    - status_is_complete
    - all_required_folds_present
    - minimum_pooled_executed_transitions_met
    - pooled_net_expectancy_gt_zero
    - pooled_cost_stressed_expectancy_gt_zero
    - strict_majority_of_fold_expectancies_positive
    - all_numerical_validity_checks_pass
  maximum_drawdown_hard_gate: false
  plateau_hard_gate: false
  year_concentration_hard_gate: false

sample_count:
  fold_metrics_trade_count: executed_raw_alpha_transitions
  raw_states: [SHORT, FLAT, LONG]
  scheduled_refresh_count: false
  ewma_volatility_update_count: false
  scaled_quantity_rebalance_count: false
  native_order_or_fill_count: false
  reversal_count: one_transition
  unexecuted_target_change_count: false
  pending_target_counts_when_first_expressed_before_supersession: true
  risk_only_rebalances_count: false
  turnover_includes_all_scaled_executed_quantity_changes: true
  costs_and_pnl_include_all_scaled_rebalances: true

production_evaluator:
  version: eurusd-tsm-v1-development-evaluator-1
  module: ftmoquant.research.eurusd_tsm_development
  trial_evaluator: ftmoquant.research.eurusd_tsm_development.EurusdTsmTrialEvaluator
  runner: ftmoquant.research.eurusd_tsm_development.run_eurusd_tsm_development
  command: uv run python -m ftmoquant.research.eurusd_tsm_development
  generic_search_engine: ftmoquant.research.g1.search.run_search
  fold_warmup: process_train_start_through_evaluation_without_training_orders
  evaluation_order_window: decision_information_time_in_evaluation_half_open_interval
  end_boundary: final_available_tradable_observation_strictly_before_evaluate_end
  read_beyond_evaluate_end: false

metric_definitions:
  trade_count: executed_raw_alpha_transitions
  turnover: total_absolute_executed_base_unit_change_divided_by_100000
  net_expectancy: total_fold_net_return_divided_by_trade_count_zero_if_no_transitions
  cost_stressed_expectancy: stressed_fold_net_return_divided_by_trade_count_zero_if_no_transitions
  cost_stress: base_net_return_minus_half_realized_base_variable_cost
  net_daily_mean: arithmetic_mean_of_causal_evaluation_daily_net_returns
  sharpe: existing_ftmoquant_annualized_daily_sharpe_sqrt_252
  drawdown: existing_ftmoquant_compounded_daily_return_maximum_drawdown
  yearly_attribution: calendar_year_net_return_contribution
  execution_perturbed_expectancy: null

neighbours:
  same_timeframe_required: true
  exactly_one_dimension_moves: true
  adjacent_steps_only: true
  ordered_dimensions: [lookback_bars, deadband, refresh_interval_bars]
  cross_timeframe_neighbours: false

selector:
  implementation: ftmoquant.research.g1.selector.select_candidate
  policy:
    min_trade_count: 100
    min_positive_folds: 2
    max_drawdown: null
    max_year_concentration: null
    max_execution_sensitivity: null
    min_evaluated_neighbours: 0
    min_acceptable_neighbour_fraction: 0.0
    required_fold_count: 3
  ranking_order:
    - descending positive DEVELOPMENT fold fraction
    - descending acceptable evaluated-neighbour fraction
    - ascending maximum absolute yearly concentration (missing last)
    - ascending execution perturbation sensitivity (missing last)
    - descending worst-fold net expectancy
    - descending cost-stressed pooled expectancy
    - descending pooled net expectancy
    - ascending maximum drawdown
    - ascending deterministic trial_id tie-breaker
  weighted_score: false

search:
  mode: exact_grid
  seed: 0
  optuna: false
  parameter_grid_frozen_before_returns: true
  enlargement_after_results: forbidden
  experiment_interpretation: one_declared_family_experiment_with_90_cells
  deflated_sharpe_ratio: not_implemented_extension_point
  probability_of_backtest_overfitting: not_implemented_extension_point

sealed_partitions:
  validation: locked_until_one_development_candidate_is_frozen
  final_holdout: locked
  strategy_returns_accessed: false

reuse:
  raw_target_enum: ftmoquant.strategies.ts_momentum.RawDirectionalTarget
  causal_target_hold_semantics: adapted_from_ts_momentum_v1
  derived_bar_pair: ftmoquant.strategies.trend_pullback.CompletedPair
  volatility_dependency: numpy
  parallel_execution_engine: false

preregistration_amendments:
  - amendment_id: causal_g1_normalization_pre_data_2026_08_16
    superseded_semantic_sha256: 6f2cdf187e40e9bc9c065c7e7befa16f89d1fe380c8626ab853474658466f116
    reason_superseded: generic_normalizer_used_whole_realized_return_series
    amendment_date: "2026-08-16"
    repository_commit_before_amendment: ca53c43d0c3486427cdc533892cd359581325752
    observed_development_trial_results: 0
    observed_development_fold_results: 0
