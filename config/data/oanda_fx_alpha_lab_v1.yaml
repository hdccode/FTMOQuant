# NEW, separate, prospective alpha-lab screening data lineage. Sourced
# entirely from OANDA v20 practice, independent of the rigorous Dukascopy
# DEVELOPMENT lineage (g1_4_fx_usd_liquid_v1 / g1_4_fx_majors_v1) used by
# already-validated strategies -- this file never touches or references
# those artifacts, and carries no strategy semantics of its own.
lineage_id: oanda_fx_alpha_lab_v1
version: 1

provider:
  name: OANDA_v20_practice
  environment: practice
  api_version: v3

development:
  start_utc: "2019-03-11T00:00:00Z"
  end_exclusive_utc: "2023-04-11T00:00:00Z"

granularity: M1
price_components: BA

missing_observation_policy:
  fills_or_interpolation: false
  synthetic_fill_permitted: false
  absent_minutes_during_genuine_market_closure_are_not_defects: true
  missing_observations_reported_explicitly: true

derived_timeframes: [M30, H1, H4]

instruments:
  - dataset_symbol: EURUSD
    instrument_id: EUR/USD.OANDA
    oanda_instrument: EUR_USD
  - dataset_symbol: GBPUSD
    instrument_id: GBP/USD.OANDA
    oanda_instrument: GBP_USD
  - dataset_symbol: AUDUSD
    instrument_id: AUD/USD.OANDA
    oanda_instrument: AUD_USD
  - dataset_symbol: USDCHF
    instrument_id: USD/CHF.OANDA
    oanda_instrument: USD_CHF
  - dataset_symbol: USDJPY
    instrument_id: USD/JPY.OANDA
    oanda_instrument: USD_JPY
  - dataset_symbol: USDCAD
    instrument_id: USD/CAD.OANDA
    oanda_instrument: USD_CAD
  - dataset_symbol: NZDUSD
    instrument_id: NZD/USD.OANDA
    oanda_instrument: NZD_USD
